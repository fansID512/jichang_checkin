name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: python vs curl
        env:
          COOKIE: ${{ secrets.COOKIE }}
        run: |
          echo "egress=$(curl -s https://api.ipify.org)"
          python - <<'EOF'
          import os, requests
          h = {"origin": "https://ikuuu.top", "referer": "https://ikuuu.top/user",
               "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36 Edg/139.0.0.0",
               "accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
               "accept-language": "zh-CN,zh;q=0.9,en;q=0.8"}
          ck = os.environ["COOKIE"]
          for tag, headers in [("minimal", {"cookie": ck}), ("browser", dict(h, cookie=ck))]:
              r = requests.post("https://ikuuu.top/user/checkin", headers=headers, timeout=30, allow_redirects=False)
              print(f"python[{tag}] {r.status_code} len={len(r.text)} body={r.text[:80]!r}")
          import urllib3; print("urllib3", urllib3.__version__, "requests", requests.__version__)
          EOF
          curl -sS -o /dev/null -w 'curl %{http_code}\n' -X POST -H "cookie: $COOKIE" -H 'origin: https://ikuuu.top' -H 'referer: https://ikuuu.top/user' https://ikuuu.top/user/checkin
