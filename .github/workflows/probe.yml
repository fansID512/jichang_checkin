name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: replicate
        env:
          URL: ${{ secrets.URL }}
          COOKIE: ${{ secrets.COOKIE }}
        run: |
          pip install -q requests curl_cffi
          python - <<'EOF'
          import os, requests
          from curl_cffi import requests as creq
          u = os.environ["URL"].strip().rstrip("/")
          ck = os.environ["COOKIE"]
          print("URL used:", u, "cookieLen:", len(ck))
          base = {"origin": u, "referer": u + "/user", "cookie": ck}
          h = dict(base)
          h["user-agent"] = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36 Edg/139.0.0.0"
          h["accept"] = "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
          h["accept-language"] = "zh-CN,zh;q=0.9,en;q=0.8"
          r = requests.post(u + "/user/checkin", headers=h, timeout=30, allow_redirects=False)
          print("requests:", r.status_code, repr(r.text[:60]))
          print("sent headers:", dict(r.request.headers))
          r2 = creq.post(u + "/user/checkin", headers=base, impersonate="chrome", timeout=30, allow_redirects=False)
          print("curl_cffi:", r2.status_code, repr(r2.text[:60]))
          r3 = requests.post(u + "/user/checkin", headers={"cookie": ck}, timeout=30, allow_redirects=False)
          print("requests-min:", r3.status_code, repr(r3.text[:60]))
          EOF
